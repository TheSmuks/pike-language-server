name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIKE_VERSION: "8.0.1116"

jobs:

  repository-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: bash scripts/check-adr-prefixes.sh
      - run: node scripts/check-phantom-deps.mjs

  typecheck:
    name: typecheck (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Cache bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  pike-fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Cache bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run fmt:check

  unit-tests:
    name: unit-tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Cache bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # This job installs no Pike, so it runs the Pike-independent subset on
      # every OS. The full suite needs a real Pike oracle and runs in the `test`
      # job below, which builds one. Running `bun test` here only ever "passed"
      # because the suite used to exit 0 while killing itself mid-run; with an
      # honest runner it fails on `Executable not found in $PATH: "pike"`.
      - name: Run non-Pike tests
        run: bun run test:non-pike

  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/quality-gates.sh --all

  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Cache bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Install Pike introspection dependency
        uses: ./.github/actions/setup-pike-introspect
      - name: Install VSCE
        run: bun add -g @vscode/vsce
      - run: bash scripts/smoke-test.sh
      - name: Standalone server serves LSP over stdio (Neovim/Helix path)
        run: bun run check:standalone
      - name: Helix LSP features return real results
        run: bun run check:helix
      # Two things nothing else covers: a contributed setting no shipped code
      # reads, and a semantic token painted over a comment or string literal.
      # Both are silent in every other gate — the second sat failing until it
      # was run by hand.
      - name: Client surface (settings are read, tokens stay out of literals)
        run: bun run audit:client-surface

  # Every artifact a user can install must serve LSP when run outside the
  # repository. Guards the whole no-build install path: an earlier bundle only
  # worked because it could reach the checkout's node_modules, and the compiled
  # binary silently lost its WASM and answered 2/15 features.
  distributions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        artifact: [tarball, npm, binary, vsix]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Cache bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Install Pike introspection dependency
        uses: ./.github/actions/setup-pike-introspect
      # Only the vsix target packages with vsce (scripts/build-vsix.sh shells
      # out to it); the other three artifacts never touch it.
      - name: Install VSCE
        if: matrix.artifact == 'vsix'
        run: bun add -g @vscode/vsce
      - name: ${{ matrix.artifact }} serves LSP
        run: bash scripts/check-distributions.sh ${{ matrix.artifact }}

  vscode-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Cache bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Install VSCode test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgtk-3-0 libgbm1 libasound2t64
      - name: Cache pike install
        id: cache-pike
        uses: actions/cache@v6
        with:
          path: ~/.pike
          key: pike-${{ env.PIKE_VERSION }}-${{ runner.os }}
      - name: Install Pike build dependencies
        if: steps.cache-pike.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            make gcc g++ libgmp-dev nettle-dev bison \
            libreadline-dev zlib1g-dev
      - name: Build Pike
        if: steps.cache-pike.outputs.cache-hit != 'true'
        run: |
          curl -sL "https://pike.lysator.liu.se/pub/pike/all/${PIKE_VERSION}/Pike-v${PIKE_VERSION}.tar.gz" \
            | tar xz
          mkdir -p "Pike-v${PIKE_VERSION}/build"
          cd "Pike-v${PIKE_VERSION}/build"
          ../src/configure \
            --prefix="$HOME/.pike" \
            --without-debug \
            --without-mysql
          make -j$(nproc) || make
          make install
      - name: Set Pike binary
        run: |
          echo "PIKE_BINARY=$HOME/.pike/pike/$PIKE_VERSION/bin/pike" >> "$GITHUB_ENV"
          "$HOME/.pike/pike/$PIKE_VERSION/bin/pike" --version

      # A cache hit restores whatever was built the first time this key was
      # used, including a silently crippled build: Pike's per-module autoconf
      # probes can fail for reasons unrelated to the library (e.g. Gz against
      # zlib 1.3+) and swap in a stub .so with no warning at build OR run time.
      # Probe every run, cached or not, so a crippled Pike fails loudly here
      # instead of degrading hover/completion for the modules it silently lost.
      - name: Assert Pike has the modules the suite depends on
        run: |
          # Only what the suite actually resolves. Image and Parser.HTML are C
          # modules the hover and oracle tiers reach through the runtime
          # resolver, and their absence degrades to empty answers rather than a
          # failure. Gz and Mysql are deliberately not checked: Mysql is
          # configured out, and Gz is dropped by an autoconf probe unrelated to
          # the library being present -- nothing in the suite resolves it.
          for module in Image Parser.HTML; do
            if ! "$PIKE_BINARY" -e "if (!master()->resolv(\"$module\")) exit(1); exit(0);"; then
              echo "Pike is missing module '$module' — the build silently dropped it." >&2
              exit 1
            fi
            echo "Pike has module: $module"
          done

      # Must precede the test run. `pmp install` puts the introspect module at
      # `modules/pike_introspect` (gitignored, absent on a bare checkout).
      # Without it INTROSPECT_PATH never resolves, the worker starts with no
      # `-M`, and every C-module symbol (Image, Parser.HTML — reachable only
      # through the runtime resolver) hovers as nothing instead of failing the
      # test. The `test` job below hit exactly this gap; this job builds the
      # same Pike but was never given the same module, so its integration
      # tests ran the degraded path unnoticed.
      # pmp resolves `pike` from PATH, not from PIKE_BINARY.
      - name: Put Pike on PATH
        run: echo "$HOME/.pike/pike/${PIKE_VERSION}/bin" >> $GITHUB_PATH

      - name: Install pmp
        run: curl -LsSf https://raw.githubusercontent.com/TheSmuks/pmp/v0.5.0/install.sh | PMP_VERSION=v0.5.0 sh

      - name: Install Pike dependencies
        run: ~/.pmp/bin/pmp install

      - name: Verify the module the runtime resolver needs is installed
        run: test -d modules/pike_introspect/src || test -d modules/Introspect/src

      - run: bash scripts/test-vscode.sh

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Cache bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile

      - name: Cache pike install
        id: cache-pike
        uses: actions/cache@v6
        with:
          path: ~/.pike
          key: pike-${{ env.PIKE_VERSION }}-${{ runner.os }}
      - name: Install build dependencies
        if: steps.cache-pike.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            make gcc g++ libgmp-dev nettle-dev bison \
            libreadline-dev zlib1g-dev
      - name: Build Pike
        if: steps.cache-pike.outputs.cache-hit != 'true'
        run: |
          curl -sL "https://pike.lysator.liu.se/pub/pike/all/${PIKE_VERSION}/Pike-v${PIKE_VERSION}.tar.gz" \
            | tar xz
          mkdir -p "Pike-v${PIKE_VERSION}/build"
          cd "Pike-v${PIKE_VERSION}/build"
          ../src/configure \
            --prefix="$HOME/.pike" \
            --without-debug \
            --without-mysql
          make -j$(nproc) || make
          make install
      - name: Set and verify Pike binary
        run: |
          echo "PIKE_BINARY=$HOME/.pike/pike/$PIKE_VERSION/bin/pike" >> "$GITHUB_ENV"
          "$HOME/.pike/pike/$PIKE_VERSION/bin/pike" --version

      # A cache hit restores whatever was built the first time this key was
      # used, including a silently crippled build: Pike's per-module autoconf
      # probes can fail for reasons unrelated to the library (e.g. Gz against
      # zlib 1.3+) and swap in a stub .so with no warning at build OR run time.
      # Probe every run, cached or not, so a crippled Pike fails loudly here
      # instead of degrading hover/completion for the modules it silently lost.
      - name: Assert Pike has the modules the suite depends on
        run: |
          # Only what the suite actually resolves. Image and Parser.HTML are C
          # modules the hover and oracle tiers reach through the runtime
          # resolver, and their absence degrades to empty answers rather than a
          # failure. Gz and Mysql are deliberately not checked: Mysql is
          # configured out, and Gz is dropped by an autoconf probe unrelated to
          # the library being present -- nothing in the suite resolves it.
          for module in Image Parser.HTML; do
            if ! "$PIKE_BINARY" -e "if (!master()->resolv(\"$module\")) exit(1); exit(0);"; then
              echo "Pike is missing module '$module' — the build silently dropped it." >&2
              exit 1
            fi
            echo "Pike has module: $module"
          done

      # Must precede the test run. The server shells out to `pike` from PATH
      # (initializationOptions.pikeBinaryPath defaults to "pike") to read
      # --show-paths. With Pike off PATH it falls back to well-known locations
      # (/usr/local/pike/<ver>, /opt/pike, ...) — none of which match a CI build
      # under $HOME/.pike, so include paths came back empty and #include
      # resolution silently returned the including file.
      - name: Add Pike and pmp to PATH
        run: echo "$HOME/.pike/pike/${PIKE_VERSION}/bin" >> $GITHUB_PATH && echo "$HOME/.pmp/bin" >> $GITHUB_PATH

      - name: Install pmp
        run: curl -LsSf https://raw.githubusercontent.com/TheSmuks/pmp/v0.5.0/install.sh | PMP_VERSION=v0.5.0 sh

      # Must precede the test run, not follow it. `pmp install` is what puts the
      # introspect module at `modules/pike_introspect` — the directory is
      # gitignored, so a checkout alone never has it. INTROSPECT_PATH resolves
      # from that path, and the worker is spawned with `-M $INTROSPECT_PATH`
      # only when it resolved; with the module absent every `worker.resolve()`
      # answers `Introspect module not available` and each caller degrades to no
      # answer rather than failing loudly. Running these steps after
      # `bun run test` left the Pike oracle the job is named for half present:
      # `Image` and `Parser.HTML` — C modules, reachable only through the
      # runtime resolver — hovered as nothing, while the `.pmod` directory
      # modules kept passing, so the gap looked like three unrelated hover bugs.
      - name: Install Pike dependencies
        run: ~/.pmp/bin/pmp install

      - name: Verify the module the runtime resolver needs is installed
        run: test -d modules/pike_introspect/src || test -d modules/Introspect/src

      - name: Run Bun tests with real Pike oracle
        run: bun run test

      - name: Run Pike tests
        run: bun run test:pike
